<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 770" role="img" aria-label="Wiring schematic: Uno in the centre, keypad top right, joystick bottom centre, LCD bottom right."><style>text{font-family:Menlo,monospace;fill:#17211d}.lbl{font-size:10px;fill:#5a6862}.title{font-family:Helvetica,Arial,sans-serif;font-size:14px;font-weight:600}.sub{font-size:10.5px;fill:#5a6862}.box{fill:#fff;stroke:#cbd5d1;stroke-width:1.5}.wire{fill:none;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.pin{fill:#17211d}.tag text{font-size:9.5px;font-weight:600;fill:#fff}.uno-ink{fill:#e6f3f8 !important}</style>

      <!-- ========== POWER (Uno to rails) ========== -->
      <g class="part power">
        <path class="wire" stroke="#d01f37" d="M460,523 V552 H402"/>
        <path class="wire" stroke="#33434d" d="M480,523 V566 H402"/>
        <g class="tag"><rect x="318" y="544" width="84" height="16" rx="8" fill="#d01f37"/><text x="360" y="555.5" text-anchor="middle">+ RAIL (red)</text></g>
        <g class="tag"><rect x="318" y="558" width="84" height="16" rx="8" fill="#33434d"/><text x="360" y="569.5" text-anchor="middle" style="fill:#fbfcfb">− RAIL (blue)</text></g>
      </g>

      <!-- ========== UNO ========== -->
      <g>
        <rect x="282" y="330" width="34" height="52" rx="3" fill="#9aa4aa"/>
        <rect x="286" y="440" width="26" height="40" rx="3" fill="#2a2f33"/>
        <rect x="300" y="288" width="400" height="244" rx="12" fill="#1d6a86"/>
        <rect x="318" y="294" width="374" height="16" rx="2" fill="#0e3b4b"/>
        <rect x="390" y="510" width="282" height="16" rx="2" fill="#0e3b4b"/>
        <g fill="#d9dde0">
          <rect x="325" y="297" width="10" height="10"/><rect x="345" y="297" width="10" height="10"/><rect x="365" y="297" width="10" height="10"/><rect x="385" y="297" width="10" height="10"/>
          <rect x="405" y="297" width="10" height="10"/><rect x="425" y="297" width="10" height="10"/><rect x="445" y="297" width="10" height="10"/><rect x="465" y="297" width="10" height="10"/>
          <rect x="485" y="297" width="10" height="10"/><rect x="505" y="297" width="10" height="10"/><rect x="535" y="297" width="10" height="10"/><rect x="555" y="297" width="10" height="10"/>
          <rect x="575" y="297" width="10" height="10"/><rect x="595" y="297" width="10" height="10"/><rect x="615" y="297" width="10" height="10"/><rect x="635" y="297" width="10" height="10"/>
          <rect x="655" y="297" width="10" height="10"/><rect x="675" y="297" width="10" height="10"/>
          <rect x="395" y="513" width="10" height="10"/><rect x="415" y="513" width="10" height="10"/><rect x="435" y="513" width="10" height="10"/><rect x="455" y="513" width="10" height="10"/>
          <rect x="475" y="513" width="10" height="10"/><rect x="495" y="513" width="10" height="10"/><rect x="515" y="513" width="10" height="10"/>
          <rect x="555" y="513" width="10" height="10"/><rect x="575" y="513" width="10" height="10"/><rect x="595" y="513" width="10" height="10"/>
          <rect x="615" y="513" width="10" height="10"/><rect x="635" y="513" width="10" height="10"/><rect x="655" y="513" width="10" height="10"/>
        </g>
        <g class="lbl" style="font-size:9.5px">
          <text class="uno-ink" x="330" y="316" text-anchor="end" transform="rotate(-90 330 316)" dy="3">SCL</text>
          <text class="uno-ink" x="350" y="316" text-anchor="end" transform="rotate(-90 350 316)" dy="3">SDA</text>
          <text class="uno-ink" x="370" y="316" text-anchor="end" transform="rotate(-90 370 316)" dy="3">AREF</text>
          <text class="uno-ink" x="390" y="316" text-anchor="end" transform="rotate(-90 390 316)" dy="3">GND</text>
          <text class="uno-ink" x="410" y="316" text-anchor="end" transform="rotate(-90 410 316)" dy="3">D13</text>
          <text class="uno-ink" x="430" y="316" text-anchor="end" transform="rotate(-90 430 316)" dy="3">D12</text>
          <text class="uno-ink" x="450" y="316" text-anchor="end" transform="rotate(-90 450 316)" dy="3">D11</text>
          <text class="uno-ink" x="470" y="316" text-anchor="end" transform="rotate(-90 470 316)" dy="3">D10</text>
          <text class="uno-ink" x="490" y="316" text-anchor="end" transform="rotate(-90 490 316)" dy="3">D9</text>
          <text class="uno-ink" x="510" y="316" text-anchor="end" transform="rotate(-90 510 316)" dy="3">D8</text>
          <text class="uno-ink" x="540" y="316" text-anchor="end" transform="rotate(-90 540 316)" dy="3">D7</text>
          <text class="uno-ink" x="560" y="316" text-anchor="end" transform="rotate(-90 560 316)" dy="3">D6</text>
          <text class="uno-ink" x="580" y="316" text-anchor="end" transform="rotate(-90 580 316)" dy="3">D5</text>
          <text class="uno-ink" x="600" y="316" text-anchor="end" transform="rotate(-90 600 316)" dy="3">D4</text>
          <text class="uno-ink" x="620" y="316" text-anchor="end" transform="rotate(-90 620 316)" dy="3">D3</text>
          <text class="uno-ink" x="640" y="316" text-anchor="end" transform="rotate(-90 640 316)" dy="3">D2</text>
          <text class="uno-ink" x="660" y="316" text-anchor="end" transform="rotate(-90 660 316)" dy="3">D1</text>
          <text class="uno-ink" x="680" y="316" text-anchor="end" transform="rotate(-90 680 316)" dy="3">D0</text>
          <text class="uno-ink" x="400" y="505" text-anchor="start" transform="rotate(-90 400 505)" dy="3">IOREF</text>
          <text class="uno-ink" x="420" y="505" text-anchor="start" transform="rotate(-90 420 505)" dy="3">RESET</text>
          <text class="uno-ink" x="440" y="505" text-anchor="start" transform="rotate(-90 440 505)" dy="3">3.3V</text>
          <text class="uno-ink" x="460" y="505" text-anchor="start" transform="rotate(-90 460 505)" dy="3">5V</text>
          <text class="uno-ink" x="480" y="505" text-anchor="start" transform="rotate(-90 480 505)" dy="3">GND</text>
          <text class="uno-ink" x="500" y="505" text-anchor="start" transform="rotate(-90 500 505)" dy="3">GND</text>
          <text class="uno-ink" x="520" y="505" text-anchor="start" transform="rotate(-90 520 505)" dy="3">VIN</text>
          <text class="uno-ink" x="560" y="505" text-anchor="start" transform="rotate(-90 560 505)" dy="3">A0</text>
          <text class="uno-ink" x="580" y="505" text-anchor="start" transform="rotate(-90 580 505)" dy="3">A1</text>
          <text class="uno-ink" x="600" y="505" text-anchor="start" transform="rotate(-90 600 505)" dy="3">A2</text>
          <text class="uno-ink" x="620" y="505" text-anchor="start" transform="rotate(-90 620 505)" dy="3">A3</text>
          <text class="uno-ink" x="640" y="505" text-anchor="start" transform="rotate(-90 640 505)" dy="3">A4</text>
          <text class="uno-ink" x="660" y="505" text-anchor="start" transform="rotate(-90 660 505)" dy="3">A5</text>
        </g>
        <rect x="455" y="392" width="120" height="44" rx="3" fill="#1c2226"/>
        <text class="uno-ink" x="515" y="419" text-anchor="middle" style="font-family:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;font-size:13px;font-weight:700;letter-spacing:.12em">UNO</text>
        <text class="uno-ink" x="335" y="360" style="font-size:9px">USB</text>
      </g>

      <!-- ========== KEYPAD ========== -->
      <g class="part keypad">
        <path class="wire" stroke="#6a4fd8" d="M705,200 V215 H510 V297"/>
        <path class="wire" stroke="#6a4fd8" d="M725,200 V225 H540 V297"/>
        <path class="wire" stroke="#6a4fd8" d="M745,200 V235 H560 V297"/>
        <path class="wire" stroke="#6a4fd8" d="M765,200 V245 H580 V297"/>
        <path class="wire" stroke="#6a4fd8" d="M785,200 V255 H600 V297"/>
        <path class="wire" stroke="#6a4fd8" d="M805,200 V265 H620 V297"/>
        <path class="wire" stroke="#6a4fd8" d="M825,200 V275 H640 V297"/>
        <text class="title" x="870" y="40">Keypad</text>
        <text class="sub" x="870" y="56">pins 1→7</text>
        <text class="sub" x="870" y="70">left to right</text>
        <rect class="box" x="690" y="20" width="160" height="180" rx="8"/>
        <g font-size="12" text-anchor="middle">
          <g fill="#3d7fd8">
            <rect x="712" y="32" width="34" height="26" rx="4"/><rect x="753" y="32" width="34" height="26" rx="4"/><rect x="794" y="32" width="34" height="26" rx="4"/>
            <rect x="712" y="64" width="34" height="26" rx="4"/><rect x="753" y="64" width="34" height="26" rx="4"/><rect x="794" y="64" width="34" height="26" rx="4"/>
            <rect x="712" y="96" width="34" height="26" rx="4"/><rect x="753" y="96" width="34" height="26" rx="4"/><rect x="794" y="96" width="34" height="26" rx="4"/>
            <rect x="753" y="128" width="34" height="26" rx="4"/>
          </g>
          <g fill="#d6403a"><rect x="712" y="128" width="34" height="26" rx="4"/><rect x="794" y="128" width="34" height="26" rx="4"/></g>
          <g style="fill:#fff;font-family:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;font-weight:600">
            <text x="729" y="49">1</text><text x="770" y="49">2</text><text x="811" y="49">3</text>
            <text x="729" y="81">4</text><text x="770" y="81">5</text><text x="811" y="81">6</text>
            <text x="729" y="113">7</text><text x="770" y="113">8</text><text x="811" y="113">9</text>
            <text x="729" y="145">*</text><text x="770" y="145">0</text><text x="811" y="145">#</text>
          </g>
        </g>
        <g class="lbl" text-anchor="middle">
          <text x="705" y="190">1</text><text x="725" y="190">2</text><text x="745" y="190">3</text><text x="765" y="190">4</text><text x="785" y="190">5</text><text x="805" y="190">6</text><text x="825" y="190">7</text>
        </g>
        <g><circle class="pin" cx="705" cy="200" r="3.5"/><circle class="pin" cx="725" cy="200" r="3.5"/><circle class="pin" cx="745" cy="200" r="3.5"/><circle class="pin" cx="765" cy="200" r="3.5"/><circle class="pin" cx="785" cy="200" r="3.5"/><circle class="pin" cx="805" cy="200" r="3.5"/><circle class="pin" cx="825" cy="200" r="3.5"/></g>
      </g>

      <!-- ========== JOYSTICK ========== -->
      <g class="part joy">
        <path class="wire" stroke="#b07a00" d="M450,595 H560 V523"/>
        <path class="wire" stroke="#b07a00" d="M450,615 H580 V523"/>
        <path class="wire" stroke="#b07a00" d="M450,635 H600 V523"/>
        <text class="title" x="300" y="722">Joystick</text>
        <rect class="box" x="300" y="582" width="150" height="118" rx="6"/>
        <circle cx="352" cy="641" r="36" fill="#2b3135"/><circle cx="352" cy="641" r="22" fill="#40484d"/>
        <text class="lbl" x="443" y="598.5" text-anchor="end" style="fill:#17211d">VRx</text>
        <text class="lbl" x="443" y="618.5" text-anchor="end" style="fill:#17211d">VRy</text>
        <text class="lbl" x="443" y="638.5" text-anchor="end" style="fill:#17211d">SW</text>
        <text class="lbl" x="443" y="658.5" text-anchor="end" style="fill:#17211d">+5V</text>
        <text class="lbl" x="443" y="678.5" text-anchor="end" style="fill:#17211d">GND</text>
        <path class="wire" stroke="#d01f37" d="M450,655 H470"/><path class="wire" stroke="#33434d" d="M450,675 H470"/>
        <circle class="pin" cx="450" cy="595" r="3.5"/><circle class="pin" cx="450" cy="615" r="3.5"/><circle class="pin" cx="450" cy="635" r="3.5"/><circle class="pin" cx="450" cy="655" r="3.5"/><circle class="pin" cx="450" cy="675" r="3.5"/>
        <g class="tag"><rect x="470" y="647.5" width="34" height="15" rx="7.5" fill="#d01f37"/><text x="487" y="658.5" text-anchor="middle">+5V</text></g>
        <g class="tag"><rect x="470" y="667.5" width="34" height="15" rx="7.5" fill="#33434d"/><text x="487" y="678.5" text-anchor="middle" style="fill:#fbfcfb">GND</text></g>
      </g>

      <!-- ========== LCD + I2C BACKPACK ========== -->
      <g class="part lcd">
        <path class="wire" stroke="#2463d6" d="M660,523 V595 H720"/>
        <path class="wire" stroke="#2463d6" d="M640,523 V615 H720"/>
        <text class="title" x="720" y="550">20×4 LCD + I2C backpack</text>
        <rect class="box" x="720" y="562" width="260" height="150" rx="6"/>
        <rect x="786" y="584" width="178" height="106" rx="3" fill="#1f3fb0"/>
        <g style="font-size:11px;fill:#d7e3ff">
          <text x="798" y="606">DECKY      04:40</text>
          <text x="798" y="626">&gt; Spotify</text>
          <text x="798" y="646">  Apps</text>
          <text x="798" y="666">  Brightness</text>
        </g>
        <text class="lbl" x="728" y="598.5" style="fill:#17211d">SCL</text>
        <text class="lbl" x="728" y="618.5" style="fill:#17211d">SDA</text>
        <text class="lbl" x="728" y="638.5" style="fill:#17211d">VCC</text>
        <text class="lbl" x="728" y="658.5" style="fill:#17211d">GND</text>
        <path class="wire" stroke="#d01f37" d="M720,635 H704"/><path class="wire" stroke="#33434d" d="M720,655 H704"/>
        <circle class="pin" cx="720" cy="595" r="3.5"/><circle class="pin" cx="720" cy="615" r="3.5"/><circle class="pin" cx="720" cy="635" r="3.5"/><circle class="pin" cx="720" cy="655" r="3.5"/>
        <g class="tag"><rect x="670" y="627.5" width="34" height="15" rx="7.5" fill="#d01f37"/><text x="687" y="638.5" text-anchor="middle">+5V</text></g>
        <g class="tag"><rect x="670" y="647.5" width="34" height="15" rx="7.5" fill="#33434d"/><text x="687" y="658.5" text-anchor="middle" style="fill:#fbfcfb">GND</text></g>
        <text class="sub" x="728" y="706">blue knob on back = contrast</text>
      </g>

      <!-- rail note -->
      <text class="sub" x="30" y="528" style="fill:#17211d;font-weight:600">Power: USB from Mac → Uno</text>
      <text class="sub" x="30" y="544">Uno 5V/GND → breadboard rails</text>
      <text class="sub" x="30" y="560">Every <tspan style="fill:#d01f37;font-weight:600">+5V</tspan> tag → red (+) rail</text>
      <text class="sub" x="30" y="576">Every <tspan style="fill:#33434d;font-weight:600">GND</tspan> tag → blue (−) rail</text>
    </svg>